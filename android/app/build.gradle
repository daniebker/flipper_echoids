plugins {
    id "com.android.application"
}

android {
    namespace "com.echoids.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.echoids.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cFlags "-O2"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            /* Signed with the debug key so the release APK installs directly.
             * Use your own keystore before publishing to an app store. */
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
