name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc src/game.c src/scanner_parse.c tests/test_game.c -o test_game
          ./test_game
      - name: Wiki page matches the code
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc src/game.c tools/gen_wiki.c -o gen_wiki
          ./gen_wiki > docs/wiki/Types-and-Moves.md
          git diff --exit-code docs/wiki/Types-and-Moves.md

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk-channel: [release, dev]
    steps:
      - uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
