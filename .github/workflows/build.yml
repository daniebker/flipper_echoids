name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc src/game.c src/scanner_parse.c tests/test_game.c -o test_game
          ./test_game
      - name: Wiki pages match the code
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc src/game.c tools/gen_wiki.c -o gen_wiki
          ./gen_wiki types > docs/wiki/Types.md
          ./gen_wiki moves > docs/wiki/Types-and-Moves.md
          ./gen_wiki echoids > docs/wiki/Echoids.md
          ./gen_wiki items > docs/wiki/Items-and-Crafting.md
          ./gen_wiki battles > docs/wiki/Battles.md
          git diff --exit-code docs/wiki/
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: echoids-docs
          path: |
            README.md
            CHANGELOG.md
            LICENSE
            docs/wiki/

  build:
    name: Flipper app (${{ matrix.sdk-channel }} firmware)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk-channel: [release, dev]
    steps:
      - uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Collect the app
        run: |
          mkdir -p fap
          cp "${{ steps.build-app.outputs.fap-dir }}"/*.fap fap/
          ls -la fap
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          # e.g. echoids-flipper-release-f7-api-88.2-1.5.1
          name: echoids-flipper-${{ matrix.sdk-channel }}-${{ steps.build-app.outputs.suffix }}
          path: fap/
      - name: Summary
        run: |
          {
            echo "### Flipper app (${{ matrix.sdk-channel }} firmware channel)"
            echo ""
            echo "Artifact **echoids-flipper-${{ matrix.sdk-channel }}-${{ steps.build-app.outputs.suffix }}** contains \`echoids.fap\`."
            echo "Built for firmware API ${{ steps.build-app.outputs.api-version }}. Copy it to \`/ext/apps/Games/\` on the SD card, or open it with qFlipper."
          } >> "$GITHUB_STEP_SUMMARY"
