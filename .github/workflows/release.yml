name: Release

# Push a version tag (git tag v1.0.0 && git push origin v1.0.0), or run this
# workflow by hand with a tag name, to publish a GitHub Release with the
# Flipper app, the Android APK and the docs attached. Unlike workflow
# artifacts, release downloads don't expire.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  flipper:
    name: Flipper app (${{ matrix.sdk-channel }} firmware)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk-channel: [release, dev]
    steps:
      - uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Collect the app
        run: |
          mkdir -p out
          cp "${{ steps.build-app.outputs.fap-dir }}"/echoids.fap \
            "out/echoids-flipper-${{ matrix.sdk-channel }}-fw-api-${{ steps.build-app.outputs.api-version }}.fap"
      - uses: actions/upload-artifact@v4
        with:
          name: release-flipper-${{ matrix.sdk-channel }}
          path: out/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/echoids-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/

  release:
    name: Publish release
    needs: [flipper, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Bundle the docs
        run: zip -r "dist/echoids-docs.zip" README.md LICENSE docs/wiki
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: Release notes
        run: |
          cat > notes.md <<NOTES
          ## Downloads

          | File | What it is |
          |---|---|
          | \`echoids-flipper-release-fw-api-*.fap\` | Flipper Zero app for **release** firmware. Copy to \`/ext/apps/Games/\` or install with qFlipper. |
          | \`echoids-flipper-dev-fw-api-*.fap\` | Flipper Zero app for **dev** firmware. |
          | \`echoids-android.apk\` | Android app (Android 7.0+). Uses the phone's own WiFi and Bluetooth. |
          | \`echoids-docs.zip\` | README and wiki (types, moves, echoids, battles, items). |
          | \`SHA256SUMS.txt\` | Checksums for the files above. |

          The Flipper needs an ESP32 board running Marauder for scanning; see the README.
          The APK is signed with a debug key, so it installs directly.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Echoids ${{ steps.tag.outputs.name }}
          body_path: notes.md
          files: dist/*
